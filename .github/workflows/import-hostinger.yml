name: Import Hostinger site

on:
  push:
    paths:
      - '.github/workflows/import-hostinger.yml'
      - 'hostinger-manifest.txt'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact site files from Hostinger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib
          import shutil

          BASE = 'https://adrianabranding.com/'
          manifest = Path('hostinger-manifest.txt')

          if not manifest.exists():
              raise SystemExit('hostinger-manifest.txt not found')

          # Replace the temporary repository content with the Hostinger site.
          shutil.rmtree('assets', ignore_errors=True)
          Path('index.html').unlink(missing_ok=True)

          rows = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              raw = raw.strip()
              if not raw:
                  continue
              rel, expected_size, expected_sha = raw.split('|', 2)
              rows.append((rel, int(expected_size), expected_sha))

          for i, (rel, expected_size, expected_sha) in enumerate(rows, 1):
              url = BASE + quote(rel, safe='/')
              req = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (GitHub Actions Hostinger import)',
                  'Accept-Encoding': 'identity',
              })
              with urlopen(req, timeout=120) as response:
                  data = response.read()

              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != expected_size or actual_sha != expected_sha:
                  raise RuntimeError(
                      f'Integrity mismatch for {rel}: '
                      f'size {actual_size}/{expected_size}, sha {actual_sha}/{expected_sha}'
                  )

              out = Path(rel)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              print(f'[{i}/{len(rows)}] {rel} ({actual_size} bytes)')

          print(f'Imported and verified {len(rows)} files.')
          PY

      - name: Commit imported site
        shell: bash
        run: |
          # Remove bootstrap-only files so the final repository mirrors public_html.
          rm -f hostinger-manifest.txt .github/workflows/import-hostinger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Adriana Branding site from Hostinger"
          git push origin HEAD:main
