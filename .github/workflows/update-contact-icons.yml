name: Update contact icons

on:
  push:
    paths:
      - '.github/workflows/update-contact-icons.yml'

permissions:
  contents: write

jobs:
  patch-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace CTA contact button with icons
        shell: bash
        env:
          OLD_B64: ICAgICAgICA8YSBocmVmPSJtYWlsdG86YWRyaWFuYWJyYW5kaW5ncGVAZ21haWwuY29tIiBjbGFzcz0iY3RhX19lbWFpbCIgZGF0YS1jdXJzb3I9ImhvdmVyIj5hZHJpYW5hYnJhbmRpbmdwZUBnbWFpbC5jb208L2E+
          NEW_B64: 
          CSS_B64: 
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          if old not in s:
              raise SystemExit('Expected CTA email button not found')
          s = s.replace(old, new, 1)
          marker = '/* ============================================================\n   FOOTER'
          if marker not in s:
              raise SystemExit('Footer CSS marker not found')
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          rm -f .github/workflows/update-contact-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace CTA email with contact icons"
          git push origin HEAD:main
