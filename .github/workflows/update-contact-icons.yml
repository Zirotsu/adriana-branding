name: Update contact icons

on:
  push:
    paths:
      - '.github/workflows/update-contact-icons.yml'

permissions:
  contents: write

jobs:
  patch-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace CTA contact button with icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <a href="mailto:adrianabrandingpe@gmail.com" class="cta__email" data-cursor="hover">adrianabrandingpe@gmail.com</a>'''
          new = '''        <div class="cta__socials" aria-label="Canales de contacto">
            <a href="mailto:adrianabrandingpe@gmail.com" class="cta__social-link" data-cursor="hover" aria-label="Enviar correo a Adriana Branding" title="Correo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3V5Zm2 2v.6l7 5.25 7-5.25V7H5Zm14 10V10.1l-7 5.25-7-5.25V17h14Z"/></svg>
            </a>
            <a href="https://www.instagram.com/adriana.branding?igsi=MTBmMGRqbjdudnF1bA==" class="cta__social-link" data-cursor="hover" aria-label="Instagram de Adriana Branding" title="Instagram" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM17 5.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
            </a>
            <a href="https://wa.me/51940708161" class="cta__social-link" data-cursor="hover" aria-label="WhatsApp de Adriana Branding: +51 940 708 161" title="WhatsApp" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.8 11.8 0 0 0 12.08 0C5.5 0 .15 5.35.15 11.93c0 2.1.55 4.15 1.6 5.96L.05 24l6.27-1.64a11.9 11.9 0 0 0 5.75 1.47h.01C18.65 23.83 24 18.48 24 11.9c0-3.18-1.24-6.17-3.48-8.42ZM12.08 21.82a9.86 9.86 0 0 1-5.03-1.38l-.36-.21-3.72.98.99-3.62-.23-.37a9.82 9.82 0 0 1-1.52-5.29c0-5.46 4.44-9.9 9.9-9.9a9.82 9.82 0 0 1 7 2.9 9.83 9.83 0 0 1 2.9 7c-.01 5.45-4.45 9.89-9.93 9.89Zm5.43-7.42c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.04-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.48.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/></svg>
            </a>
        </div>'''

          if old not in s:
              raise SystemExit('Expected CTA email button not found')
          s = s.replace(old, new, 1)

          marker = '''/* ============================================================\n   FOOTER'''
          css = '''
.cta__socials {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
}
.cta__social-link {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--yellow);
    transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out), transform 0.3s var(--ease-out);
}
.cta__social-link svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
}
.cta__social-link:hover {
    background: var(--paper);
    color: var(--ink);
    transform: translateY(-3px) scale(1.04);
}
@media (max-width: 900px) {
    .cta__socials { gap: 12px; }
    .cta__social-link { width: 58px; height: 58px; }
    .cta__social-link svg { width: 25px; height: 25px; }
}

'''
          if marker not in s:
              raise SystemExit('Footer CSS marker not found')
          s = s.replace(marker, css + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          rm -f .github/workflows/update-contact-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace CTA email with contact icons"
          git push origin HEAD:main
