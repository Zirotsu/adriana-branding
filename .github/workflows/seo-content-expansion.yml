name: SEO content expansion

on:
  push:
    paths:
      - '.github/workflows/seo-content-expansion.yml'

permissions:
  contents: write

jobs:
  expand-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand SEO content and service pages
        shell: bash
        run: echo '' | base64 -d | python3

      - name: Commit expanded SEO structure
        shell: bash
        run: |
          rm -f .github/workflows/seo-content-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand SEO content and Peru service pages"
          git push origin HEAD:main
